# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# Jpa
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Formats the SQL in the console so it's readable
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Ensures Flyway runs before Hibernate validation
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.flyway.before-check-location=true

# JWT
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-must-be-long-enough}
jwt.expiration=${JWT_EXPIRATION:3600000}

app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

finnhub.api.key=${FINNHHUB_API_KEY}
